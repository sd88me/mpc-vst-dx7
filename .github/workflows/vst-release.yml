# Build Dexed (DX7) into a DRAFT release (dx7-v<version>) with mpc-vst-plugins' shared workflow:
# Actions -> "VST release (draft)" -> Run workflow. Then install that draft's zip on a device,
# smoke-test it, and publish the draft (see mpc-vst-plugins docs/RELEASING.md).
# dry_run builds the zip and skin previews as run artifacts only.
# tools_ref is pinned to a commit on mpc-vst-plugins main (the portable layout, installer -n and MODES, user_data input).
name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.0
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  release:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@7d366b83ef75c3ea2ae893ba03df8e93e5e274ec
    permissions:
      contents: write
    with:
      tag: dx7-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 7d366b83ef75c3ea2ae893ba03df8e93e5e274ec
      vst_dir: .
      build: bash build.sh
      plugin_id: dexed-dx7
      license: GPL-3.0-only
      extra: banks:dx7_carts
      user_data: dx7_carts
      requires: "MPC OS standalone (Force/Live/One/X/Key) with root SSH access; 44.1 kHz"
      about: "6-operator FM synthesis (Dexed/MSFA via schwung-dx7), with the DX7-editor LCD touchscreen skin ported from force-dx7."
      dry_run: ${{ inputs.dry_run }}
