# DX7 (schwung-dx7) MPC skin layout -- ported from force-dx7/addon/shadow_page.conf's
# GLOBAL + OP1..OP6 tabs (theme block copied verbatim). BANKS tab (its own dedicated `list` of
# every bank on disk) still dropped -- no static-VST-parameter analogue -- but GLOBAL's top bar
# now recreates the original readout/stepper feel for real: `stepper key=syx_bank_index
# prev=prev_syx_bank next=next_syx_bank get=bank_name` and `stepper key=preset get=patch_name`
# bind directly to schwung-dx7's actual get_param()/set_param() text and verbs (no ctrl_sock
# needed -- this is real in-process DSP, unlike force-dx7's control-socket page). Bank/patch
# names ARE live text, same as the original page; the bank stepper's own prev/next arrows are a
# strict improvement on the original (tap-to-BANKS-tab only, no live +/- stepping there).
# Differences from schwung-dx7's own module.json (Move "knobs" subset of ~20 params): every
# key below is confirmed handled in schwung-dx7 src/dsp/dx7_plugin.cpp's v2_set_param/get_param,
# not just the curated Move UI. OPn_DETUNE range is -7..7 here (schwung-dx7's actual set_param
# contract), NOT force-dx7's raw 0..14 -- see vst-schwung/module.json.
style=lcd
int_values=1
theme_bg=0f1214
theme_panel=161a1d
theme_line=2f363b
theme_ink=d8dee2
theme_ink_dim=7c868c
theme_ink_faint=4b5359
theme_accent=4ad6d6
theme_accent_hi=9af2f2
theme_knob_face=0b0d0e
theme_knob_ring=2a3034
theme_bar=0a0c0d
theme_seg_active=4ad6d6
theme_seg_inactive=0b0d0e
theme_seg_active_tx=0a0c0d
theme_btn_text=0a0c0d
theme_well=0b0d0e
theme_knob_off=3a4247
theme_tab_on=12262a
theme_lcd=07100f

[tab GLOBAL]
stepper cx=220 cy=112 w=360 h=48 label="" key=syx_bank_index prev=prev_syx_bank next=next_syx_bank get=bank_name
stepper cx=700 cy=112 w=460 h=48 label="" key=preset get=patch_name
